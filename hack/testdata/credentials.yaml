# Manifests that hack/check_no_credentials.py must refuse, one way per
# object. CI runs the check on this file and expects it to fail with every
# one of them reported.
apiVersion: v1
kind: Secret
metadata:
  name: a-secret
stringData:
  token: not-a-real-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: a-config
data:
  ORIGINCLOUD_ACCESS_TOKEN: not-a-real-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a-deployment
spec:
  selector:
    matchLabels: {app: a}
  template:
    metadata:
      labels: {app: a}
    spec:
      containers:
        - name: c
          image: example.invalid/c:v1
          env:
            - name: ORIGINCLOUD_CREDENTIALS_FILE
              value: /creds.json
            - name: SOMETHING
              valueFrom:
                secretKeyRef: {name: a-secret, key: token}
          envFrom:
            - secretRef: {name: a-secret}
      volumes:
        - name: s
          secret: {secretName: a-secret}
        - name: p
          projected:
            sources:
              - secret: {name: a-secret}
