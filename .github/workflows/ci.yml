# Checks every pull request and every push to main: the code is formatted,
# tidy, vetted and linted, and the tests pass with the race detector. The
# tests include the csi-test sanity suite against the controller plugin.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Go
        uses: 'actions/setup-go@v5'
        with:
          go-version-file: go.mod

      - name: Formatting and modules
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "not gofmt-formatted:"; echo "${unformatted}"; exit 1
          fi
          go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: 'golangci/golangci-lint-action@v8'
        with:
          version: v2.15.0

      - name: Tests and csi-sanity
        run: go test -race ./...

      - name: Build
        run: go build -o /dev/null ./cmd/origincloud-csi-driver
