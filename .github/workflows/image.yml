# Builds the driver's image for linux/amd64 and linux/arm64, each on a
# runner of its own architecture, and checks each one by running it (the
# node plugin's tools are on its PATH, --mode=node starts and answers
# GetPluginInfo with the build's version).
#
# A version tag (v1.2.3, v1.2.3-rc.1) then publishes the multi-arch image to
# ghcr.io/origincloudhq/csi-driver-origincloud, tagged with the version.
# Pull requests and pushes to main only build and check; they push nothing.
name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # A release is never cancelled half-pushed.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ghcr.io/origincloudhq/csi-driver-origincloud

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Go
        uses: 'actions/setup-go@v5'
        with:
          go-version-file: go.mod
          cache: false

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "tag ${version} isn't a version (vMAJOR.MINOR.PATCH[-PRERELEASE])"; exit 1
            fi
          else
            version="v0.0.0-dev.${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Buildx
        uses: 'docker/setup-buildx-action@v3'

      - name: Build
        uses: 'docker/build-push-action@v6'
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          push: false
          tags: csi-driver-origincloud:check
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Check the image
        run: |
          go mod download github.com/container-storage-interface/spec
          hack/smoke-test-image.sh csi-driver-origincloud:check "${{ steps.version.outputs.version }}"

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      # The Go build cross-compiles; QEMU only runs the arm64 package install.
      - name: QEMU
        uses: 'docker/setup-qemu-action@v3'

      - name: Buildx
        uses: 'docker/setup-buildx-action@v3'

      - name: Log in to ghcr.io
        uses: 'docker/login-action@v3'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: 'docker/build-push-action@v6'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64

      - name: Check the manifest list
        run: |
          ref="${IMAGE}:${GITHUB_REF_NAME}"
          docker buildx imagetools inspect "${ref}"
          platforms="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')"
          if [[ "${platforms}" != "linux/amd64,linux/arm64" ]]; then
            echo "the manifest list holds ${platforms}, want linux/amd64,linux/arm64"; exit 1
          fi
